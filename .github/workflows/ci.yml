name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate example manifest
        run: python scripts/validate_manifest.py models/example_wake_word.json --allow-missing-model
      - name: Generate ESPHome snippet
        run: python scripts/export_esphome.py models/example_wake_word.json --output /tmp/example.yaml
      - name: Validate empty dataset folders
        run: python scripts/prepare_dataset.py data/positive data/negative --manifest /tmp/dataset_manifest.json --allow-empty
      - name: Inspect dataset catalog
        run: python scripts/show_datasets.py --recommended first --write-plan /tmp/dataset_plan.json
      - name: Check data staging folders
        run: python scripts/stage_dataset_dirs.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
