name: Missed wake report
description: Report wake phrase attempts that the device did not detect.
title: "[missed-wake]: "
labels: ["hardware-test", "missed-wake"]
body:
  - type: input
    id: model_version
    attributes:
      label: Model version
      placeholder: Hey Komi v0.1.0 candidate
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: ESP32-S3-BOX-3, M5Stack Atom Echo, XIAO ESP32S3
    validations:
      required: true
  - type: input
    id: microphone
    attributes:
      label: Microphone
      placeholder: Built-in mic, INMP441, ReSpeaker, other
    validations:
      required: true
  - type: input
    id: room
    attributes:
      label: Room
      placeholder: Quiet office, living room with fan noise, kitchen
    validations:
      required: true
  - type: input
    id: attempts
    attributes:
      label: Attempts
      placeholder: 20
    validations:
      required: true
  - type: input
    id: missed_wakes
    attributes:
      label: Missed wakes
      placeholder: 3
    validations:
      required: true
  - type: input
    id: distance
    attributes:
      label: Distance from microphone
      placeholder: 1m
    validations:
      required: true
  - type: textarea
    id: manifest_settings
    attributes:
      label: Manifest settings
      description: Paste probability_cutoff, sliding_window_size, tensor_arena_size, and ESPHome version.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Accent, speaking speed, wake phrase pronunciation, noise, device placement.
    validations:
      required: false
